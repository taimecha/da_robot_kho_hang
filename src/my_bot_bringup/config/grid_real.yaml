# Sa ban 5x5 cho XE THAT tren ban do real_room_map. Doc boi grid_navigator.py --real.
#
# Danh so tu 1 (giong anh docs/sa_ban_5x5_preview.png):
#   hang 1 = duoi cung (y nho nhat) -> hang 5 = tren cung
#   cot  1 = ben trai  (x nho nhat) -> cot  5 = ben phai
#
# Sa ban CO DINH tren ban do: diem (hang 3, cot 3) luon o (center_x, center_y)
# du xe dang dung o dau. Doi tam sang vi tri xe hien tai:
#     python3 tools/set_grid_center.py
# Ve lai anh xem truoc:
#     python3 tools/preview_grid.py

rows: 5
cols: 5
spacing: 0.6            # m, canh moi o vuong

# Diem (center_row, center_col) nam o (center_x, center_y) tren ban do.
# Lay tu vi tri xe ngay 2026-10-03 (khop anh quet voi ban do, 72% tia trung tuong).
center_row: 3
center_col: 3
center_x: -0.545
center_y: 0.035

# Xe that: than tron duong kinh 18 cm, banh nho ra -> ban kinh bao 0.13 m
# (giong robot_radius trong navigation.yaml).
robot_radius: 0.13
# Mot DIEM bi bo neu cach tuong / vat can / vung chua biet tren ban do
# gan hon node_clearance; mot CANH bi bo neu ca doan noi gan hon edge_clearance.
# Cung dung cho vat can moi xuat hien tren local costmap luc xe chay.
node_clearance: 0.25
edge_clearance: 0.20

# Xoay tai cho o dau moi doan (grid_navigator tu lam, khong de Nav2 xoay).
# Lenh toi banh tre ~0.3 s (do tren xe that): node du doan goc xe se troi them
# (toc do quay x lag) va ra lenh dung som dung chung do.
rotate:
  start_deg: 10      # dau xe lech huong doan hon muc nay thi xoay truoc
  stop_deg: 0.6      # sai so du doan khi ra lenh dung; chot lai bang goc do sau khi xe dung han
  done_deg: 0.9      # moi bao da toi goal neu sai so goc thuc te < 0.9 do (< 1 do)
  tries: 12          # gioi han xoay bu; vuot nguong van bao loi, khong bao da toi
  max_speed: 1.3     # rad/s
  min_speed: 0.7     # rad/s - cham hon thi banh ket o ma sat tinh
  decel: 2.5         # rad/s2 - giam toc khi gan dich: v = sqrt(2*decel*goc)
  lag: 0.3           # s - tre lenh -> banh. Van vuot goc: tang; dung som qua: giam
  motor_tau: 0.12    # s - quan tinh dong co sau khi lenh toi
  # Xe con quay them coast * w_do_duoc sau khi ra lenh 0 (do tren xe 2026-10-03,
  # firmware Kf 3.0: 0.36 s). Dung thay cho lag/motor_tau (mo hinh theo lenh
  # dung som ~20 do vi xe chi quay duoc 0.86 rad/s khi lenh 1.3). 0 = mo hinh cu.
  coast: 0.36
  # Xung vong ho cho goc nho, kiem tra lai goc sau khi xe dung han.
  pulse_max_deg: 5   # xoay bu goc nho bang xung, tranh banh ket ma sat tinh
  pulse_speed: 0.7   # rad/s, qua velocity_smoother + collision_monitor
  pulse_dead: 0.35   # s dau xung bi tre/ma sat nuot, bo xoay tu hoc lai sau moi xung
