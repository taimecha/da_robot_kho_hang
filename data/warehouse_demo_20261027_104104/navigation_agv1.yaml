amcl:
  ros__parameters:
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    base_frame_id: base_footprint
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    laser_likelihood_max_dist: 1.0
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    robot_model_type: nav2_amcl::DifferentialMotionModel
    set_initial_pose: true
    sigma_hit: 0.08
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.9
    z_rand: 0.1
behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    global_frame: map
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    robot_base_frame: base_footprint
    spin:
      plugin: nav2_behaviors::Spin
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    global_frame: map
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: /agv1/odom
    robot_base_frame: base_footprint
collision_monitor:
  ros__parameters:
    FootprintApproach:
      action_type: approach
      enabled: true
      footprint_topic: /agv1/local_costmap/published_footprint
      min_points: 6
      simulation_time_step: 0.1
      time_before_collision: 1.2
      type: polygon
      visualize: false
    base_frame_id: base_footprint
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    observation_sources:
    - scan
    odom_frame_id: odom
    polygons:
    - FootprintApproach
    scan:
      enabled: true
      topic: /agv1/scan
      type: scan
    source_timeout: 1.5
    stop_pub_timeout: 2.0
    transform_tolerance: 0.2
controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.25
      curvature_lookahead_dist: 0.6
      desired_linear_vel: 0.22
      interpolate_curvature_after_goal: false
      lookahead_dist: 0.2
      lookahead_time: 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 20.0
      max_lookahead_dist: 0.3
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.08
      min_lookahead_dist: 0.15
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      rotate_to_heading_angular_vel: 1.3
      rotate_to_heading_min_angle: 0.35
      stateful: true
      transform_tolerance: 0.5
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      use_velocity_scaled_lookahead_dist: false
    PrecisionFollowPath:
      allow_reversing: false
      approach_velocity_scaling_dist: 0.2
      curvature_lookahead_dist: 0.6
      desired_linear_vel: 0.22
      interpolate_curvature_after_goal: false
      lookahead_dist: 0.2
      lookahead_time: 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_angular_accel: 20.0
      max_lookahead_dist: 0.3
      max_robot_pose_search_dist: 10.0
      min_approach_linear_velocity: 0.025
      min_lookahead_dist: 0.15
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      rotate_to_heading_angular_vel: 1.3
      rotate_to_heading_min_angle: 0.35
      stateful: true
      transform_tolerance: 0.5
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: false
      use_velocity_scaled_lookahead_dist: false
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    - PrecisionFollowPath
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.35
    goal_checker_plugins:
    - general_goal_checker
    - precision_goal_checker
    precision_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.012
      yaw_goal_tolerance: 0.35
    precision_progress_checker:
      movement_time_allowance: 4.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.003
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
    progress_checker_plugins:
    - progress_checker
    - precision_progress_checker
docking_server:
  ros__parameters:
    base_frame: base_footprint
    controller_frequency: 50.0
    dock_approach_timeout: 30.0
    dock_backwards: false
    dock_plugins:
    - simple_charging_dock
    dock_prestaging_tolerance: 0.5
    fixed_frame: odom
    initial_perception_timeout: 5.0
    max_retries: 3
    simple_charging_dock:
      docking_threshold: 0.05
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_roll: -1.57
      external_detection_rotation_yaw: 0.0
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      filter_coef: 0.1
      plugin: opennav_docking::SimpleChargingDock
      staging_x_offset: -0.7
      use_battery_status: false
      use_external_detection_pose: true
      use_stall_detection: false
    undock_angular_tolerance: 0.1
    undock_linear_tolerance: 0.05
    wait_charge_timeout: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          topic: /agv1/scan
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.13
      static_layer:
        map_subscribe_transient_local: true
        map_topic: /map
        plugin: nav2_costmap_2d::StaticLayer
      update_frequency: 1.0
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      global_frame: map
      height: 6
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 2.0
          observation_persistence: 1.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          topic: /agv1/scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.05
      robot_base_frame: base_footprint
      robot_radius: 0.13
      rolling_window: true
      update_frequency: 5.0
      width: 6
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: true
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 1.0
    - 0.0
    - 4.0
    max_decel:
    - -1.0
    - 0.0
    - -8.0
    max_velocity:
    - 0.3
    - 0.0
    - 1.5
    min_velocity:
    - -0.3
    - 0.0
    - -1.5
    scale_velocities: false
    smoothing_frequency: 20.0
    velocity_timeout: 1.0
